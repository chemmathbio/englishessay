<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Activity Workspace Module</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        .webgl-content { width: 100%; height: 100%; }
        #gameContainer { width: 100vw; height: 100vh; }
    </style>
    <!-- Loads the required underlying game formatting and stylesheet engines -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script>
        // Instantiates the full 3D rolling physics system
        var gameInstance = UnityLoader.instantiate("gameContainer", "https://jsdelivr.net", {
            onProgress: UnityProgress,
            Module: {
                onRuntimeInitialized: function() {
                    UnityProgress(gameInstance, "complete");
                }
            }
        });
    </script>
</head>
<body>
    <div class="webgl-content">
        <!-- Renders the full screen canvas element locally -->
        <div id="gameContainer"></div>
    </div>
</body>
</html>
